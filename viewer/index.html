<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Beetbox Eval Arena</title>
    <meta name="description" content="Compare interactive Beetbox reconstructions made by coding models from the same visual reference and short prompt." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171915'/%3E%3Cpath d='M15 15h14v14H15zm20 0h14v14H35zM15 35h14v14H15zm20 0h14v14H35z' fill='%23d5ff52'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css?v=header-tooltips" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" data-site-header data-reference-toggle></header>

      <aside class="sidebar">
        <div class="catalog-header"><span aria-hidden="true"></span><button class="catalog-sort" type="button" data-sort="audio" data-tooltip="Audio is rated by whether sound works and the instruments, balance, and behavior make a convincing musical product.">AUDIO</button><button class="catalog-sort" type="button" data-sort="visual" data-tooltip="Visual prompt analysis is rated by whether the model read key details correctly, especially C+ and A+ rather than C# and A#.">VISUAL<br />PROMPT<br />ANALYSIS</button><button class="catalog-sort" type="button" data-sort="music" data-tooltip="Music is rated by whether the written notes are actually played at the correct pitches and tuning.">MUSIC</button><button class="catalog-sort" type="button" data-sort="price">INPUT<br />$/M</button></div>
        <div class="catalog" id="catalog" aria-live="polite"></div>
        <button class="about-arena-button" type="button" data-about-open><strong>What is this Beetbox Eval Arena???</strong></button>
      </aside>

      <main class="workspace">
        <section class="comparison solo" id="comparison">
          <article class="preview-panel" data-side="a">
            <div class="viewport"><div class="canvas"><iframe title="Preview A" loading="eager" allow="autoplay; fullscreen" allowfullscreen></iframe></div><div class="loading-card"><span></span>Preview is starting</div></div>
          </article>
          <article class="preview-panel" data-side="b">
            <div class="viewport"><div class="canvas"><iframe title="Preview B" loading="eager" allow="autoplay; fullscreen" allowfullscreen></iframe></div><div class="loading-card"><span></span>Preview is starting</div></div>
          </article>
        </section>
      </main>
    </div>

    <script type="module" src="site-header.js?v=reference-position"></script>
    <script type="module" src="app.js?v=sortable-columns"></script>
    <script type="module" src="about-dialog.js?v=input-price"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Beetbox Model Arena</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171915'/%3E%3Cpath d='M15 15h14v14H15zm20 0h14v14H35zM15 35h14v14H15zm20 0h14v14H35z' fill='%23d5ff52'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css?v=fit-width" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <a class="brand-home" href="index.html" aria-label="Beetbox Model Arena home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><strong>BEETBOX MODEL ARENA</strong></a>
          <span class="brand-byline">by <a href="https://keunwoochoi.github.io/">Keunwoo Choi</a></span>
        </div>
      </header>

      <aside class="sidebar">
        <div class="catalog" id="catalog" aria-live="polite"></div>
      </aside>

      <main class="workspace">
        <section class="controls" aria-label="Comparison controls">
          <div class="mode-switch" role="group" aria-label="View mode">
            <button data-mode="solo" type="button">Solo</button>
            <button class="active" data-mode="split" type="button">Split</button>
          </div>
          <label class="select-control"><span>A</span><select id="select-a" aria-label="Choose left preview"></select></label>
          <label class="select-control second"><span>B</span><select id="select-b" aria-label="Choose right preview"></select></label>
        </section>

        <section class="comparison split" id="comparison">
          <article class="preview-panel" data-side="a">
            <header class="preview-header">
              <div class="preview-identity"><span class="provider-chip">Source</span><div><strong>Reference video</strong><small>Original Beetbox capture</small></div></div>
            </header>
            <div class="viewport"><div class="canvas"><iframe title="Preview A" loading="eager" allow="autoplay; fullscreen" allowfullscreen></iframe></div><div class="loading-card"><span></span>Preview is starting</div></div>
          </article>
          <article class="preview-panel" data-side="b">
            <header class="preview-header">
              <div class="preview-identity"><span class="provider-chip">OpenAI</span><div><strong>GPT-5.6 Sol</strong><small>Codex CLI · xhigh</small></div></div>
            </header>
            <div class="viewport"><div class="canvas"><iframe title="Preview B" loading="eager" allow="autoplay; fullscreen" allowfullscreen></iframe></div><div class="loading-card"><span></span>Preview is starting</div></div>
          </article>
        </section>

      </main>
    </div>

    <script type="module" src="app.js?v=fit-width"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEETBOX - Beat sequencing • channel desk.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">BEETBOX</div>
      <div class="title">Beat sequencing • channel desk.</div>
    </header>

    <!-- Control Panel -->
    <div class="control-panel">
      <button id="play-btn" class="play-btn">▶ PLAY</button>

      <div class="control-group">
        <div class="control-label">TEMPO</div>
        <input type="range" id="tempo-slider" class="slider" min="60" max="200" value="132">
        <div class="control-value" id="tempo-value">132</div>
      </div>

      <div class="control-group">
        <div class="control-label">SWING</div>
        <input type="range" id="swing-slider" class="slider" min="0" max="50" value="0">
        <div class="control-value" id="swing-value">0%</div>
      </div>

      <div class="control-group">
        <div class="control-label">VOLUME</div>
        <input type="range" id="volume-slider" class="slider" min="0" max="100" value="90">
        <div class="control-value" id="volume-value">90</div>
      </div>

      <div class="on-air">
        <input type="checkbox" id="on-air-toggle">
        <label for="on-air-toggle">ON AIR</label>
      </div>
    </div>

    <!-- Channel Buttons -->
    <div class="channel-buttons">
      <button class="channel-btn active" data-channel="10">CH.10 DARKROOM</button>
      <button class="channel-btn" data-channel="20">CH.20 GREASE</button>
      <button class="channel-btn" data-channel="30">CH.30 BACKSTREET</button>
      <button class="channel-btn" data-channel="40">CH.40 DAYLIGHT</button>
      <button class="channel-btn" data-channel="50">CH.50 ACID</button>
    </div>

    <!-- Clear/Random Buttons -->
    <div class="action-buttons">
      <button id="clear-btn" class="action-btn">CLEAR</button>
      <button id="random-btn" class="action-btn">RANDOM</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Visualizer -->
      <div class="visualizer">
        <canvas id="visualizer-canvas"></canvas>
      </div>

      <!-- Sequencer -->
      <div class="sequencer-wrapper">
        <!-- Left Panel: Tracks -->
        <div class="tracks-panel">
          <div class="track-header">TRACK click = mute 💾</div>
          <div class="tracks-list" id="tracks-list">
            <!-- Tracks will be generated by JavaScript -->
          </div>
        </div>

        <!-- Grid -->
        <div class="grid-container">
          <div class="step-numbers">
            <div class="step-number-spacer"></div>
            <div id="step-indicators" class="step-numbers-row">
              <!-- Numbers will be generated by JavaScript -->
            </div>
          </div>
          <div id="sequencer-grid" class="sequencer-grid">
            <!-- Grid will be generated by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Bottom Controls -->
      <div class="bottom-controls">
        <button class="loop-rec-btn">▬ LOOP REC</button>
        <div class="chord-buttons">
          <div class="chord-label">LEAD</div>
          <button class="chord-btn" data-pitch="0">A</button>
          <button class="chord-btn" data-pitch="2">C</button>
          <button class="chord-btn" data-pitch="3">D</button>
          <button class="chord-btn" data-pitch="5">E</button>
          <button class="chord-btn" data-pitch="7">G</button>
          <button class="chord-btn" data-pitch="9">A+</button>
          <button class="chord-btn" data-pitch="12">C+</button>
        </div>
        <div class="bass-label">BASS</div>
      </div>

      <!-- Note Labels -->
      <div class="note-labels">
        <div class="note-label">
          <span class="note-upper">A</span>
          <span class="note-lower">A</span>
        </div>
        <div class="note-label">
          <span class="note-upper">C</span>
          <span class="note-lower">S</span>
        </div>
        <div class="note-label">
          <span class="note-upper">D</span>
          <span class="note-lower">D</span>
        </div>
        <div class="note-label">
          <span class="note-upper">E</span>
          <span class="note-lower">F</span>
        </div>
        <div class="note-label">
          <span class="note-upper">G</span>
          <span class="note-lower">G</span>
        </div>
        <div class="note-label">
          <span class="note-upper">A+</span>
          <span class="note-lower">H</span>
        </div>
        <div class="note-label">
          <span class="note-upper">C+</span>
          <span class="note-lower">J</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Click cells to write beats • tap LEAD / BASS to cycle pitch (right-click lowers) • click a track name to mute</p>
      <p><span class="keyboard-hint">Space</span> play/stop</p>
    </footer>

    <!-- Menu Buttons (top right) -->
    <div class="menu-buttons">
      <button class="menu-btn" id="expand-btn">⛶</button>
      <button class="menu-btn" id="options-btn">⋯</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
